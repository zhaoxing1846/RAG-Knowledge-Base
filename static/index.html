<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif;height:100vh;overflow:hidden;color:#333}
input,button{font-family:inherit}

/* Auth */
.auth-page{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#667eea,#764ba2)}
.auth-card{background:#fff;border-radius:20px;padding:40px;width:400px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-card h1{text-align:center;color:#667eea;margin-bottom:24px}
.auth-tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #eee}
.auth-tab{flex:1;text-align:center;padding:10px;cursor:pointer;color:#999;font-size:.9em}
.auth-tab.active{color:#667eea;border-bottom:2px solid #667eea;margin-bottom:-2px;font-weight:600}
.auth-form{display:none}
.auth-form.active{display:block}
.auth-form input{width:100%;padding:12px 16px;border:2px solid #eee;border-radius:12px;font-size:1em;margin-bottom:12px;outline:none}
.auth-form input:focus{border-color:#667eea}
.auth-form .btn{width:100%;padding:12px;border:none;border-radius:12px;font-size:1em;cursor:pointer;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600}
.auth-form .btn:disabled{opacity:.5;cursor:not-allowed}
.auth-msg{color:#e74c3c;font-size:.85em;margin-top:8px;text-align:center;display:none}
.auth-msg.ok{color:#27ae60}

/* Chat */
.chat-page{display:none;height:100vh}
.chat-page.active{display:flex}
.sidebar{width:260px;min-width:260px;background:#1a1a2e;color:#fff;display:flex;flex-direction:column}
.sidebar-hd{padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-user{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sidebar-user span{font-size:.9em;opacity:.8}
.logout-btn,.del-btn,.admin-btn{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 12px;border-radius:8px;cursor:pointer;font-size:.8em;white-space:nowrap}
.admin-btn{border-color:rgba(255,200,50,.4);color:#ffd700;margin-left:4px}
.logout-btn:hover,.admin-btn:hover{background:rgba(255,255,255,.1)}
.del-btn{border-color:rgba(255,80,80,.4);color:#ff6b6b;padding:2px 8px;font-size:.7em;flex-shrink:0}
.del-btn:hover{background:rgba(255,80,80,.15)}
.new-chat-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border:1px dashed rgba(255,255,255,.3);border-radius:10px;background:transparent;color:#fff;cursor:pointer;font-size:.9em;margin-top:8px}
.new-chat-btn:hover{background:rgba(255,255,255,.1)}
.conv-list{flex:1;overflow-y:auto;padding:8px}
.conv-row{display:flex;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.conv-row:hover{background:rgba(255,255,255,.08)}
.conv-row.active{background:rgba(102,126,234,.3)}
.conv-title{flex:1;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.conv-time{font-size:.65em;opacity:.4;margin-top:2px}
.no-convs{text-align:center;padding:40px 16px;opacity:.4;font-size:.85em}

/* Main */
.main{flex:1;display:flex;flex-direction:column;background:#f5f7fb}
.chat-hd{padding:14px 20px;background:#fff;border-bottom:1px solid #e8e8e8;font-weight:600;font-size:1em}
.msgs{flex:1;overflow-y:auto;padding:20px}
.msg{margin-bottom:16px;display:flex;flex-direction:column}
.msg.user{align-items:flex-end}
.msg.assistant{align-items:flex-start}
.bubble{max-width:80%;padding:12px 16px;border-radius:18px;line-height:1.6;word-wrap:break-word}
.msg.user .bubble{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bubble p{margin:.4em 0}
.bubble ul,.bubble ol{margin:.4em 0;padding-left:1.5em}
.bubble li{margin:.15em 0}
.bubble code{background:#f4f4f4;padding:1px 5px;border-radius:4px;font-family:monospace}
.bubble pre{background:#f4f4f4;padding:10px;border-radius:8px;overflow-x:auto;margin:.5em 0}
.bubble pre code{background:transparent;padding:0}
.bubble blockquote{border-left:3px solid #667eea;padding-left:10px;margin:.5em 0;color:#666}
.bubble table{border-collapse:collapse;margin:.5em 0}
.bubble th,.bubble td{border:1px solid #ddd;padding:5px 10px}
.bubble th{background:#f4f4f4}
.src-box{font-size:.75em;color:#888;margin-top:6px;padding:6px 12px;background:#f0f0f0;border-radius:8px;max-width:80%;word-break:break-all}
.empty{display:flex;flex:1;align-items:center;justify-content:center;opacity:.4}

/* Input */
.input-area{padding:16px 20px;background:#fff;border-top:1px solid #e8e8e8;display:flex;gap:10px}
.input-area input{flex:1;padding:12px 16px;border:2px solid #eee;border-radius:24px;font-size:1em;outline:none}
.input-area input:focus{border-color:#667eea}
.input-area button{padding:12px 24px;border:none;border-radius:24px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:600;cursor:pointer}
.input-area button:disabled{opacity:.5;cursor:not-allowed}

.typing{display:flex;align-items:center;gap:4px;background:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.dot{width:8px;height:8px;background:#667eea;border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
.dot:nth-child(2){animation-delay:-.16s}
.dot:nth-child(3){animation-delay:-.32s}
@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

/* Streaming cursor */
.stream-cursor{animation:blink 1s step-end infinite;font-weight:bold;color:#667eea}
@keyframes blink{50%{opacity:0}}

/* Admin modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:700px;max-width:90vw;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin-bottom:16px;color:#333;font-size:1.2em}
.modal table{width:100%;border-collapse:collapse;margin-bottom:16px}
.modal th,.modal td{padding:8px 10px;text-align:left;border-bottom:1px solid #eee;font-size:.85em}
.modal th{background:#f5f7fb;font-weight:600;color:#666}
.modal td{color:#333}
.modal .badge{padding:2px 8px;border-radius:10px;font-size:.75em;font-weight:600}
.badge.admin{background:rgba(255,200,50,.2);color:#b8860b}
.badge.user{background:rgba(102,126,234,.15);color:#667eea}
.modal .btn-sm{padding:4px 12px;border:none;border-radius:6px;cursor:pointer;font-size:.8em;margin:0 2px}
.btn-sm.danger{background:#e74c3c;color:#fff}
.btn-sm.promote{background:#27ae60;color:#fff}
.btn-sm.demote{background:#f39c12;color:#fff}
.modal-close{float:right;background:transparent;border:none;font-size:1.2em;cursor:pointer;color:#999;padding:0 4px}
.modal-close:hover{color:#333}
.modal .empty-row{text-align:center;padding:30px;color:#999}

/* Admin status bar */
.admin-bar{display:none;background:#ffd700;color:#333;padding:6px 16px;font-size:.8em;text-align:center;font-weight:500}
.admin-bar.active{display:block}
.admin-bar a{color:#333;font-weight:700;cursor:pointer;text-decoration:underline}
#upBtn:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>

<div class="auth-page" id="authPage">
  <div class="auth-card">
    <h1>RAG 知识库</h1>
    <div class="auth-tabs" id="authTabs">
      <div class="auth-tab active" data-tab="login">登录</div>
      <div class="auth-tab" data-tab="reg">注册</div>
    </div>
    <div class="auth-form active" id="fLogin">
      <input type="text" id="lu" placeholder="用户名">
      <input type="password" id="lp" placeholder="密码">
      <button class="btn" id="lbtn" onclick="login()">登录</button>
      <div class="auth-msg" id="lmsg"></div>
    </div>
    <div class="auth-form" id="fReg">
      <input type="text" id="ru" placeholder="用户名">
      <input type="password" id="rp" placeholder="密码">
      <input type="password" id="rp2" placeholder="确认密码">
      <button class="btn" id="rbtn" onclick="reg()">注册</button>
      <div class="auth-msg" id="rmsg"></div>
    </div>
  </div>
</div>

<div class="chat-page" id="chatPage">
  <div class="sidebar">
    <div class="sidebar-hd">
      <div class="sidebar-user">
        <span id="userLabel">-</span>
        <div style="display:flex;gap:4px">
          <button class="admin-btn" id="adminBtn" onclick="openAdmin()" style="display:none">⚙️ 管理</button>
          <button class="logout-btn" onclick="logout()">退出</button>
        </div>
      </div>
      <button class="new-chat-btn" onclick="newConv()">[+] 新建对话</button>
    </div>
    <div class="conv-list" id="convList"></div>
  </div>
  <div class="main">
    <div class="admin-bar" id="adminBar"><span id="adminBarText">管理员模式</span></div>
    <div class="chat-hd" id="chatTitle">选择对话</div>
    <div class="msgs" id="msgs">
      <div class="empty"><p>输入问题开始对话</p></div>
    </div>
    <div class="input-area">
      <input type="text" id="inp" placeholder="输入问题..." onkeydown="if(event.key=='Enter')send()">
      <button id="sbtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<!-- Admin Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="width:750px">
    <button class="modal-close" onclick="closeAdmin()">✕</button>
    
    <h2>👤 用户管理</h2>
    <div>
      <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
        <thead><tr><th style="padding:8px 10px;text-align:left;border-bottom:1px solid #eee;background:#f5f7fb;font-weight:600;color:#666;font-size:.85em">ID</th><th style="padding:8px 10px;text-align:left;border-bottom:1px solid #eee;background:#f5f7fb;font-weight:600;color:#666;font-size:.85em">用户名</th><th style="padding:8px 10px;text-align:left;border-bottom:1px solid #eee;background:#f5f7fb;font-weight:600;color:#666;font-size:.85em">角色</th><th style="padding:8px 10px;text-align:left;border-bottom:1px solid #eee;background:#f5f7fb;font-weight:600;color:#666;font-size:.85em">注册时间</th><th style="padding:8px 10px;text-align:left;border-bottom:1px solid #eee;background:#f5f7fb;font-weight:600;color:#666;font-size:.85em">操作</th></tr></thead>
        <tbody id="adminUserList"><tr><td class="empty-row" colspan="5" style="text-align:center;padding:30px;color:#999">加载中...</td></tr></tbody>
      </table>
    </div>
    
    <hr style="margin:16px 0;border:none;border-top:1px solid #eee">
    
    <h2>📄 知识库文档 <span id="docCount" style="font-size:.7em;color:#999;font-weight:400"></span></h2>
    <div style="margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="file" id="uploadFile" accept=".pdf" style="flex:1;min-width:180px;padding:6px;border:1px solid #ddd;border-radius:8px;font-size:.85em">
      <button onclick="uploadPDF()" id="upBtn" style="padding:8px 20px;border:none;border-radius:8px;background:#27ae60;color:#fff;font-weight:600;cursor:pointer;font-size:.85em">📤 上传并索引</button>
      <button onclick="loadDocList()" style="padding:8px 16px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:.85em">刷新</button>
    </div>
    <div id="uploadStatus" style="font-size:.85em;margin-bottom:8px;color:#666;min-height:20px"></div>
    <div id="docList" style="max-height:250px;overflow-y:auto;font-size:.82em;border:1px solid #eee;border-radius:8px;padding:4px;background:#fafafa">
      <div style="text-align:center;padding:20px;color:#999">加载中...</div>
    </div>
  </div>
</div>

<script>
var T='rag_token',U='rag_usr',R='rag_role',tok=localStorage.getItem(T),usr=localStorage.getItem(U),role=localStorage.getItem(R)||'user',cid=null,convs=[],loading=false;

function hdr(){return tok?{'Content-Type':'application/json','Authorization':'Bearer '+tok}:{'Content-Type':'application/json'}}

async function api(url,opts){
  try{
    var r=await fetch(url,Object.assign({},opts,{headers:Object.assign(hdr(),(opts&&opts.headers)||{})}));
    if(r.status==401){localStorage.removeItem(T);localStorage.removeItem(U);localStorage.removeItem(R);location.reload()}
    return r.json()
  }catch(e){return{error:e.message}}
}

/* Auth */
document.getElementById('authTabs').onclick=function(e){
  var t=e.target;if(!t.classList.contains('auth-tab'))return
  document.querySelectorAll('.auth-tab').forEach(function(x){x.classList.remove('active')})
  document.querySelectorAll('.auth-form').forEach(function(x){x.classList.remove('active')})
  t.classList.add('active')
  document.getElementById(t.dataset.tab=='login'?'fLogin':'fReg').classList.add('active')
  document.querySelectorAll('.auth-msg').forEach(function(x){x.style.display='none'})
}

function showErr(id,msg,ok){
  var e=document.getElementById(id);e.textContent=msg;e.style.display='block'
  e.className='auth-msg'+(ok?' ok':'')
}

async function login(){
  var u=document.getElementById('lu').value.trim(),p=document.getElementById('lp').value.trim()
  if(!u||!p){showErr('lmsg','请填写完整');return}
  document.getElementById('lbtn').disabled=true
  var d=await api('/api/login',{method:'POST',body:JSON.stringify({username:u,password:p})})
  document.getElementById('lbtn').disabled=false
  if(d.success){
    // 解析 JWT 获取角色
    var _role='user'
    try{
      var parts=d.token.split('.')
      if(parts.length==3){var p=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));_role=p.role||'user'}
    }catch(e){}
    localStorage.setItem(T,d.token);localStorage.setItem(U,u);localStorage.setItem(R,_role)
    tok=d.token;usr=u;role=_role;init()
  }
  else showErr('lmsg',d.message||'失败')
}

async function reg(){
  var u=document.getElementById('ru').value.trim(),p=document.getElementById('rp').value.trim(),p2=document.getElementById('rp2').value.trim()
  if(!u||!p){showErr('rmsg','请填写完整');return}
  if(p!=p2){showErr('rmsg','密码不一致');return}
  if(p.length<4){showErr('rmsg','密码至少4位');return}
  document.getElementById('rbtn').disabled=true
  var d=await api('/api/register',{method:'POST',body:JSON.stringify({username:u,password:p})})
  document.getElementById('rbtn').disabled=false
  if(d.success){
    switchTab('login');document.getElementById('lmsg').textContent='✅ 注册成功，请登录'
    document.getElementById('lmsg').style.display='block';document.getElementById('lmsg').className='auth-msg ok'
  }else showErr('rmsg',d.message||'失败')
}

function switchTab(t){
  var tab=document.querySelector('[data-tab="'+t+'"]');if(tab)tab.click()
}

function logout(){
  localStorage.removeItem(T);localStorage.removeItem(U);localStorage.removeItem(R);tok=null;usr=null;cid=null;role='user'
  document.getElementById('authPage').style.display='flex'
  document.getElementById('chatPage').classList.remove('active')
}

/* Chat */
function renderMD(t){
  if(typeof marked!='undefined')return marked.parse(esc(t))
  return '<p>'+esc(t)+'</p>'
}

function esc(t){
  var d=document.createElement('div');d.textContent=t;return d.innerHTML
}

async function loadConvs(){
  convs=await api('/api/conversations')
  var el=document.getElementById('convList')
  if(!convs||!convs.length){el.innerHTML='<div class="no-convs">暂无对话</div>';return}
  el.innerHTML=convs.map(function(c){
    var a=c.id==cid?' active':''
    return '<div class="conv-row'+a+'" onclick="sel(\''+c.id+'\')">'+
      '<div style="flex:1;min-width:0"><div class="conv-title">'+esc(c.title)+'</div>'+
      '<div class="conv-time">'+(c.updated_at||'')+'</div></div>'+
      '<button class="del-btn" onclick="event.stopPropagation();del(\''+c.id+'\')">✕</button></div>'
  }).join('')
}

async function del(id){
  if(!confirm('删除此对话？'))return
  var d=await api('/api/conversations/'+id,{method:'DELETE'})
  if(d.success!==false){
    if(id==cid){cid=null;document.getElementById('msgs').innerHTML='<div class="empty"><p>对话已删除</p></div>';document.getElementById('chatTitle').textContent='选择对话'}
    loadConvs()
  }
}

async function sel(id){
  try{
    cid=id;loading=true
    document.getElementById('sbtn').disabled=true
    var m=await api('/api/conversations/'+id+'/messages')
    var el=document.getElementById('msgs'),c=convs.find(function(x){return x.id==id})
    document.getElementById('chatTitle').textContent=c?c.title:'对话'
    if(!m||!m.length){el.innerHTML='<div class="empty"><p>空对话</p></div>';loading=false;document.getElementById('sbtn').disabled=false;loadConvs();return}
    el.innerHTML=m.map(function(msg){
      return '<div class="msg '+msg.role+'"><div class="bubble">'+(msg.role=='user'?esc(msg.content):renderMD(msg.content))+'</div></div>'
    }).join('')
    el.scrollTop=el.scrollHeight
  }catch(e){console.error(e)}
  finally{loading=false;document.getElementById('sbtn').disabled=false;loadConvs()}
}

async function newConv(){
  var d=await api('/api/conversations',{method:'POST',body:JSON.stringify({title:'新对话'})})
  cid=d.id;loading=false
  document.getElementById('msgs').innerHTML='<div class="empty"><p>输入问题开始对话</p></div>'
  document.getElementById('chatTitle').textContent='新对话'
  loadConvs()
  document.getElementById('inp').focus()
}

async function send(){
  var inp=document.getElementById('inp'),q=inp.value.trim()
  if(!q||loading)return
  if(!cid){alert('请先选择或新建一个对话');return}
  inp.value='';loading=true;document.getElementById('sbtn').disabled=true

  await api('/api/conversations/'+cid+'/messages',{method:'POST',body:JSON.stringify({role:'user',content:q})})

  var el=document.getElementById('msgs'),emp=el.querySelector('.empty')
  if(emp)emp.style.display='none'
  el.innerHTML+='<div class="msg user"><div class="bubble">'+esc(q)+'</div></div>'
  el.scrollTop=el.scrollHeight

  // 创建流式输出的消息容器
  var td=document.createElement('div');td.className='msg assistant'
  var bubble=document.createElement('div');bubble.className='bubble';bubble.id='streamBubble'
  bubble.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>'
  td.appendChild(bubble)
  el.appendChild(td);el.scrollTop=el.scrollHeight

  var msgs=await api('/api/conversations/'+cid+'/messages')
  var hist=msgs.filter(function(m){return m.role!='system'}).slice(0,-1).map(function(m){return{role:m.role,content:m.content}})
  var fullAnswer='',sources=[],streamText='',streamDone=false

  try{
    var resp=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,history:hist,top_k:5})})
    if(!resp.body){bubble.innerHTML='<p>网络错误</p>';streamDone=true;return}
    var reader=resp.body.getReader(),dec=new TextDecoder(),buf=''
    while(true){
      var r=await reader.read();if(r.done)break
      buf+=dec.decode(r.value,{stream:true})
      var lines=buf.split('\n');buf=lines.pop()
      for(var i=0;i<lines.length;i++){
        var line=lines[i];if(!line.startsWith('data: '))continue
        try{
          var dt=JSON.parse(line.slice(6))
          if(dt.type=='sources'){sources=dt.content}
          else if(dt.type=='token'){
            streamText+=dt.content
            // 实时更新：使用纯文本显示（流式阶段不做markdown渲染以保证速度）
            bubble.innerHTML=esc(streamText)+'<span class="stream-cursor">▌</span>'
            el.scrollTop=el.scrollHeight
          }
          else if(dt.type=='answer'){
            fullAnswer=dt.content
            // 渲染为 Markdown
            bubble.innerHTML=renderMD(fullAnswer)
            if(sources&&sources.length>0){
              var srcDiv=document.createElement('div');srcDiv.className='src-box'
              srcDiv.textContent='📚 '+sources.join(', ')
              td.appendChild(srcDiv)
            }
            el.scrollTop=el.scrollHeight
            streamDone=true
          }
        }catch(e){}
      }
    }
  }catch(e){
    if(!streamDone)bubble.innerHTML='<p>网络连接出错</p>'
  }

  // 保存助手消息
  if(fullAnswer){
    await api('/api/conversations/'+cid+'/messages',{method:'POST',body:JSON.stringify({role:'assistant',content:fullAnswer})})
    msgs=await api('/api/conversations/'+cid+'/messages')
    el.innerHTML=msgs.map(function(m){
      return '<div class="msg '+m.role+'"><div class="bubble">'+(m.role=='user'?esc(m.content):renderMD(m.content))+'</div></div>'
    }).join('')
    el.scrollTop=el.scrollHeight
    // auto title
    if(msgs.length<=2){
      var title=q.substring(0,30)+(q.length>30?'...':'')
      await api('/api/conversations/'+cid,{method:'PATCH',body:JSON.stringify({title:title})})
      document.getElementById('chatTitle').textContent=title
    }
    loadConvs()
  }
  loading=false;document.getElementById('sbtn').disabled=false
}

/* Admin */
function openAdmin(){
  document.getElementById('adminModal').classList.add('active')
  loadAdminUsers()
  loadDocList()
}

function closeAdmin(){
  document.getElementById('adminModal').classList.remove('active')
}

async function loadAdminUsers(){
  var el=document.getElementById('adminUserList')
  el.innerHTML='<tr><td class="empty-row" colspan="5">加载中...</td></tr>'
  var d=await api('/api/admin/users')
  if(!d||d.error||!d.users){el.innerHTML='<tr><td class="empty-row" colspan="5">加载失败</td></tr>';return}
  el.innerHTML=d.users.map(function(u){
    var badge='<span class="badge '+(u.role=='admin'?'admin':'user')+'">'+(u.role=='admin'?'管理员':'用户')+'</span>'
    var btns=''
    if(u.username!='admin'&&u.username!=usr){
      if(u.role=='admin')
        btns='<button class="btn-sm demote" onclick="changeRole('+u.id+',\'user\')">降为普通用户</button>'
      else
        btns='<button class="btn-sm promote" onclick="changeRole('+u.id+',\'admin\')">提升为管理员</button>'
      btns+='<button class="btn-sm danger" onclick="delUser('+u.id+',\''+u.username+'\')">删除</button>'
    }else if(u.username=='admin'){
      btns='<span style="color:#999;font-size:.8em">系统管理员</span>'
    }else{
      btns='<span style="color:#999;font-size:.8em">当前用户</span>'
    }
    return '<tr><td>'+u.id+'</td><td>'+esc(u.username)+'</td><td>'+badge+'</td><td style="font-size:.8em">'+u.created_at+'</td><td>'+btns+'</td></tr>'
  }).join('')
}

async function changeRole(uid,newRole){
  var label=newRole=='admin'?'提升为管理员':'降为普通用户'
  if(!confirm('确认'+label+'？'))return
  var d=await api('/api/admin/users/role',{method:'PUT',body:JSON.stringify({user_id:uid,role:newRole})})
  if(d.success){loadAdminUsers()}
  else alert(d.message||'操作失败')
}

async function delUser(uid,uname){
  if(!confirm('确认删除用户 "'+uname+'"？\n该用户的所有对话将被同时删除！'))return
  var d=await api('/api/admin/users/'+uid,{method:'DELETE'})
  if(d.success){loadAdminUsers()}
  else alert(d.message||'删除失败')
}

// 点击遮罩关闭
document.getElementById('adminModal').onclick=function(e){
  if(e.target==this)closeAdmin()
}

/* Upload & Documents */
async function uploadPDF(){
  var inp=document.getElementById('uploadFile')
  var file=inp.files[0]
  if(!file){alert('请选择PDF文件');return}
  var btn=document.getElementById('upBtn'),st=document.getElementById('uploadStatus')
  btn.disabled=true;btn.textContent='⏳ 处理中...'
  st.innerHTML='<span style="color:#666">正在上传 '+file.name+' ('+Math.round(file.size/1024)+' KB)...</span>'
  var fd=new FormData()
  fd.append('file',file)
  try{
    var r=await fetch('/api/upload',{method:'POST',body:fd})
    var d=await r.json()
    if(r.ok && d.success){
      st.innerHTML='<span style="color:#27ae60">✅ '+file.name+' 索引成功！新增 '+d.chunks_added+' 个片段，知识库共 '+d.total_documents+' 篇文档</span>'
      loadDocList()
      inp.value=''
    }else{
      st.innerHTML='<span style="color:#e74c3c">❌ 失败：'+(d.detail||'未知错误')+'</span>'
    }
  }catch(e){
    st.innerHTML='<span style="color:#e74c3c">❌ 网络错误：'+e.message+'</span>'
  }
  btn.disabled=false;btn.textContent='📤 上传并索引'
}

async function loadDocList(){
  var el=document.getElementById('docList'),cnt=document.getElementById('docCount')
  el.innerHTML='<div style="text-align:center;padding:16px;color:#999">加载中...</div>'
  var d=await api('/api/documents')
  if(!d||d.error||!d.documents){
    el.innerHTML='<div style="text-align:center;padding:16px;color:#999">获取失败</div>'
    return
  }
  cnt.textContent='（共 '+d.total+' 篇）'
  if(d.documents.length==0){
    el.innerHTML='<div style="text-align:center;padding:16px;color:#999">暂无文档</div>'
    return
  }
  el.innerHTML=d.documents.map(function(name,idx){
    var icon=name.endsWith('.pdf')?'📄':'📋'
    return '<div style="padding:4px 8px;border-bottom:1px solid #f0f0f0;font-size:.85em;color:#555">'+
      '<span style="display:inline-block;width:24px;text-align:right;color:#ccc;margin-right:8px;font-size:.8em">'+(idx+1)+'</span>'+
      icon+' '+esc(name)+'</div>'
  }).join('')
}

async function init(){
  // 自动加载文档列表（打开 admin 时再加载）
  document.getElementById('userLabel').textContent=usr||'用户'
  // 管理员按钮和提示
  if(role=='admin'){
    document.getElementById('adminBtn').style.display='inline-block'
    document.getElementById('adminBar').classList.add('active')
    document.getElementById('adminBarText').textContent='👑 管理员模式 | 用户名: '+usr
  }else{
    document.getElementById('adminBtn').style.display='none'
    document.getElementById('adminBar').classList.remove('active')
  }
  document.getElementById('authPage').style.display='none'
  document.getElementById('chatPage').classList.add('active')
  await loadConvs()
  if(convs&&convs.length>0)await sel(convs[0].id);else await newConv()
}

if(tok&&usr)init()
